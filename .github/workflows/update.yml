name: Preise aktualisieren
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "1 = Diagnose-Ausgabe im Log"
        default: "0"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/WilgotM/quick-fut-price.git"
      - run: mkdir site && cp index.html site/ && python update_prices.py
        env:
          DIAGNOSE: ${{ inputs.diagnose }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
